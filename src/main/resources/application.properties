spring.application.name=ecofood-backend
server.port=${SERVER_PORT:5000}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.config.import=optional:file:./config/local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000


# Schema changes will be managed explicitly when persistence is implemented.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.default-schema=ecofood
spring.flyway.schemas=ecofood
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgresql
spring.flyway.clean-disabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

supabase.url=${SUPABASE_URL:https://gboyzmcobvpqxzenxszv.supabase.co}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${supabase.url}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${supabase.url}/auth/v1/.well-known/jwks.json
spring.jackson.deserialization.accept-float-as-int=false
